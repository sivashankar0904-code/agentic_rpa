<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Label Captchas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.3/htmx.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
        h1 { font-size: 1.25rem; }
        .row { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 0; border-bottom: 1px solid #ddd; }
        .row img { image-rendering: pixelated; border: 1px solid #ccc; background: #fff; }
        .row form { display: flex; gap: 0.5rem; flex: 1; }
        .row input[type=text] { flex: 1; padding: 0.4rem; font-size: 1rem; }
        .row button { padding: 0.4rem 0.9rem; }
        .empty { color: #666; padding: 1rem 0; }
        .error { color: #b00020; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h1>Unsolved captchas</h1>
    <div id="captcha-list">
        {% include "_captcha_list.html" %}
    </div>
    <script>
        // autofocus only fires on the initial page load — after a row is
        // removed (its solve succeeded), re-focus the textbox that's now
        // first in the list so labeling can continue without touching the mouse.
        document.body.addEventListener("htmx:afterSwap", () => {
            const firstInput = document.querySelector("#captcha-list .row input[type=text]");
            if (firstInput) {
                firstInput.focus();
            }
        });
    </script>
</body>
</html>
