<div class="row">
    <img src="/label/{{ captcha.object_name }}/image" alt="{{ captcha.object_name }}" width="200" height="50" />
    <form
        hx-post="/label/{{ captcha.object_name }}/solve"
        hx-target="closest .row"
        hx-swap="outerHTML swap:200ms"
    >
        <input type="text" name="label" placeholder="Enter captcha text" autocomplete="off" required {% if autofocus %}autofocus{% endif %} />
        <button type="submit">Save</button>
    </form>
</div>
