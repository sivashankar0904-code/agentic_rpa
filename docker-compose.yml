services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: ["api"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      AGENTIC_RPA_CELERY_BROKER_URL: redis://redis:6379/0
      AGENTIC_RPA_CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["worker"]
    restart: unless-stopped
    # Docker's default /dev/shm is 64MB, which Chromium/Chrome exhausts on
    # anything but the lightest page (raster/tile buffers live there) and
    # crashes the renderer with SIGTRAP. Observed usage peaked around ~85MB
    # on a real target page; 256MB gives headroom without over-provisioning.
    shm_size: "256mb"
    ports:
      # VNC into the worker's virtual display (x11vnc, no password) — connect
      # a viewer like TightVNC to localhost:5901 to watch PyAutoGUI live.
      # Host port is 5901 (not 5900) to avoid clashing with a VNC server
      # already running on the host itself. Bound to loopback only; not safe
      # to expose beyond your own machine as-is.
      - "127.0.0.1:5901:5900"
    environment:
      AGENTIC_RPA_CELERY_BROKER_URL: redis://redis:6379/0
      AGENTIC_RPA_CELERY_RESULT_BACKEND: redis://redis:6379/1
      DISPLAY: ":99"
    depends_on:
      redis:
        condition: service_healthy
    # Scale with: docker compose up --scale worker=3
    # Each replica gets its own Xvfb via the container's own DISPLAY (design.md gap #4).
    # Note: scaling past 1 replica will conflict on the published 5900 port above.

  beat:
    build: .
    command: ["beat"]
    restart: unless-stopped
    environment:
      AGENTIC_RPA_CELERY_BROKER_URL: redis://redis:6379/0
      AGENTIC_RPA_CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

  flower:
    build: .
    command: ["flower"]
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      AGENTIC_RPA_CELERY_BROKER_URL: redis://redis:6379/0
      AGENTIC_RPA_CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
